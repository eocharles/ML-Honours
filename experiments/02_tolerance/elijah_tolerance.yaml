experiment_name: elijah_tolerance
base_seed: 20260713
outer_folds: 2
inner_folds: 2
reference_fraction: 0.20

candidate_pool:
  seed: 4817
  candidates_per_family: 1
  model_families:
    - random_forest
    - gradient_boosting

search_space:
  preprocessing:
    scalers: [standard]
    numeric_imputers: [median]
  models:
    random_forest:
      n_estimators: [20, 40]
      max_depth: [4]
      min_samples_leaf: [1]
      max_features: [sqrt]
    gradient_boosting:
      n_estimators: [20, 40]
      learning_rate: [0.10]
      max_depth: [2]
      min_samples_leaf: [1]
    mlp:
      width: [16, 32]
      layers: [1]
      alpha: [0.001]
      learning_rate_init: [0.001]
      max_iter: 40

selection_stability:
  perturbations: 2
  train_fraction: 0.80
  evaluation_rows: 8
  background_rows: 4
  shap_permutations: 2
  top_k: 3
  seed_offset: 10000

final_stability:
  perturbations: 2
  train_fraction: 0.80
  evaluation_rows: 8
  background_rows: 4
  shap_permutations: 2
  top_k: 3
  seed_offset: 50000

selectors:
  relative_tolerances: [0.05, 0.10, 0.20, 0.25]
  use_one_standard_error_floor: false
  include_knee_point: true

output:
  save_candidate_results: true
  save_attribution_vectors: false
  fail_fast: true
